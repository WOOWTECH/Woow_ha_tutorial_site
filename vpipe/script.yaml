defaults:
  tail: 0.7
slides:
  - id: 1
    lines:
      - "這是「渥星人」臉書粉專的社群體檢，我用兩分鐘帶你看完。"
      - "資料來自 Odoo 社群行銷模組，17 個月、57 篇貼文。"
  - id: 2
    lines:
      - "先看四個關鍵數字。"
      - "粉絲 677 人，近期成長是 0。"
      - "平均單篇觸及，從 232 掉到 27。"
      - "17 個月累積的留言與分享，都是 0。"
      - "按讚 36 個，全部來自 2025 年那批貼文。"
  - id: 3
    lines:
      - "一句話結論：問題不在有沒有發，"
      - "而在發的方式，把觸及打死了。"
  - id: 4
    lines:
      - "把 57 篇貼文的觸及攤開來，斷崖一目了然。"
      - "2025 年，每週一篇產品文，平均觸及 232。"
      - "接著，粉專停更了八個半月。"
      - "隔年 6 月 1 日，兩分鐘內塞進 23 篇同質貼文。"
      - "結果平均觸及只剩 1.8，其中四篇是 0。"
      - "同一天，還有六篇測試貼文，誤發到正式粉專。"
      - "隔天改回單篇發文，觸及回到兩位數，帳號還有救。"
      - "但 8 月用短網址重啟，觸及只剩 27。"
  - id: 5
    lines:
      - "這次體檢，一共找出六個問題。"
      - "第一，批次傾倒是主傷口，演算法降權是持久性的。"
      - "第二，六篇測試貼文還掛在粉專上，要人工確認刪除。"
      - "第三，排程中的五篇全是重複主題，發出前要先刪舊版。"
      - "第四，短網址讓觸及再掉三分之二。"
      - "第五，歸因層沒建起來，行銷活動是空的、短碼重複。"
      - "第六，文案有日文亂入與簡體字，沒校對就上線。"
  - id: 6
    lines:
      - "怎麼救？停掉部落格導流機器人模式，改成新節奏。"
      - "每週二、週五各發一篇，永遠不要同一天發多篇。"
      - "時段改到台灣時間，晚上八點到十點。"
      - "改用原生圖文，連結放在留言區第一則。"
      - "內容改成真實場景：實裝照、前後對比、客戶問題。"
  - id: 7
    lines:
      - "重啟之前，先完成五個立即動作。"
      - "第一，暫停 8 月底那五篇排程。"
      - "第二，上臉書確認六篇測試貼文已刪。"
      - "第三，刪掉 6 月 1 日那 23 篇。"
      - "第四，清掉重複短碼，建立第一個行銷活動。"
      - "第五，一週後，用新節奏重啟發文。"
  - id: 8
    lines:
      - "先清頁面，再談新內容。"
      - "這就是渥星人的重啟計畫，我們下次見。"
